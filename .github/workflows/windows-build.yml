name: Windows WPF Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore solution
        run: dotnet restore ParallelDiskTree.sln
      - name: Build solution
        run: dotnet build ParallelDiskTree.sln --configuration Release --no-restore --nologo
